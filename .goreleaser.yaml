# goreleaser config for pipedrive-mcp.
#
# This file owns: cross-compiled archives, SHA256SUMS, cosign-signed
# blobs, CycloneDX SBOM, GitHub Release publishing.
#
# It does NOT own:
#   - SLSA build-provenance attestation (see .github/workflows/release.yml)
#   - Release-notes generation; we keep CHANGELOG.md as the source of
#     truth and the workflow extracts the matching section before
#     calling goreleaser.

version: 2

project_name: pipedrive-mcp

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: pipedrive-mcp
    main: ./cmd/pipedrive-mcp
    binary: pipedrive-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/mmedum/pipedrive-mcp/internal/version.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

# The macOS universal binary exists for the Claude Desktop bundle alone.
# A manifest names a command per PLATFORM and has no key for the
# architecture, so the macOS entry has to work on both. `ids` on the
# archives keeps it out of them: a fourth macOS download on the release
# page is a choice nobody should have to make.
universal_binaries:
  - id: pipedrive-mcp-universal
    ids: [pipedrive-mcp]
    replace: false
    hooks:
      # The one point in the pipeline where every binary exists and the
      # checksum file has not been written, which is what MAKES it
      # possible for the bundle to be in that file and therefore under
      # the signature. It is not what puts it there: goreleaser hashes
      # the artifacts IT built, and a file a hook drops into dist/ is not
      # one. `checksum.extra_files` covers it and `release.extra_files`
      # uploads it — both, or the bundle ships unsigned, or is hashed and
      # never published, looking no different either way.
      post: go run ./scripts/gates mcpb-pack dist {{ .Version }} dist/pipedrive-mcp-{{ .Version }}.mcpb

archives:
  - id: default
    ids: [pipedrive-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: SHA256SUMS
  algorithm: sha256
  # The bundle is not an archive goreleaser built, so packing it in the
  # post hook is only half of what puts it here — the checksum step
  # covers its own artifacts, and a file a hook dropped into dist/ is not
  # one. Naming it is the other half, and being in SHA256SUMS is what
  # gets it signed, because the signature is over that file.
  extra_files:
    - glob: ./dist/*.mcpb

signs:
  # One signature, over the checksum file, in cosign's bundle format —
  # the same shape the four sibling MCP servers use. Every archive and
  # every SBOM is covered by its hash in SHA256SUMS, so signing each
  # artifact separately bought a longer asset list rather than more
  # assurance.
  #
  # The bundle carries the signature AND the certificate together.
  # `--output-signature`/`--output-certificate` are deprecated: a cosign
  # new enough to default to `--new-bundle-format` ignores them and then
  # fails with `create bundle file: open : no such file or directory`,
  # because no bundle path was given. That is what broke v0.3.0.
  #
  # `signature:` is a shell-style template expanded with `${artifact}`,
  # NOT a Go template. Don't use `{{ .Artifact }}` — goreleaser v2 runs
  # the Go template engine here with a context that has no `.Artifact`.
  - id: cosign-keyless
    cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

sboms:
  # ${artifact} and ${document} are shell env vars goreleaser sets
  # before exec'ing syft — the same pattern used by signs: above.
  # Don't replace these with Go templates ({{ .Path }} etc.) —
  # goreleaser v2 doesn't expose Path on the sbom args context, and
  # the build fails at "cataloging artifacts" if you try.
  - id: cyclonedx
    artifacts: archive
    documents:
      - "${artifact}.cdx.json"
    cmd: syft
    args:
      - scan
      - "${artifact}"
      - --source-name
      - "{{ .ProjectName }}"
      - --source-version
      - "{{ .Version }}"
      - -o
      - "cyclonedx-json=${document}"

# No changelog block. We maintain CHANGELOG.md by hand (Keep a Changelog
# format with rich `### Security` / `### Breaking` sections), and the
# release workflow extracts the matching section and passes it to
# `goreleaser release --release-notes`, so there is nothing to generate.
#
# This block used to say `disable: true`, which reads like the way to
# suppress the generated commit list and is not: Disable is evaluated in
# the changelog pipe's Skip, which runs before Run, so ctx.ReleaseNotes
# was never assigned and the file the workflow had just written was never
# opened. Every release page this project has published is the footer
# with nothing above it. Deleting the block is what actually leaves
# --release-notes in charge.

release:
  draft: false
  prerelease: auto
  mode: replace
  # Checksummed is not uploaded. Without this the bundle is named in
  # SHA256SUMS and absent from the release, which is a hash of something
  # nobody can download.
  extra_files:
    - glob: ./dist/*.mcpb
  # The notes come first and the verification block after, matching the
  # sibling servers: a reader wants to know what changed before being
  # told how to check the signature. This was a `header:` while the
  # notes were being discarded, when it was the only thing on the page.
  footer: |
    ---

    Verify a binary signature:

    ```sh
    cosign verify-blob \
      --certificate pipedrive-mcp-{{ .Version }}-linux-amd64.tar.gz.cert \
      --signature   pipedrive-mcp-{{ .Version }}-linux-amd64.tar.gz.sig \
      --certificate-identity-regexp 'https://github.com/mmedum/pipedrive-mcp/.+' \
      --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      pipedrive-mcp-{{ .Version }}-linux-amd64.tar.gz
    ```

    Verify the SLSA build-provenance attestation:

    ```sh
    gh attestation verify pipedrive-mcp-{{ .Version }}-linux-amd64.tar.gz --owner mmedum
    ```
