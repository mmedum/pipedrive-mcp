name: Docker publish

# Triggered by the same tag push that triggers release.yml. Splits the
# Docker concern out so goreleaser stays focused on archives. Pattern
# borrowed from github/github-mcp-server (separate goreleaser.yml +
# docker-publish.yml).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image:
    name: Build, sign, push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Dockerfile FROM lines are digest-pinned
        run: |
          if grep -E '^FROM ' Dockerfile | grep -v '@sha256:'; then
            echo "::error::Dockerfile FROM lines must pin by @sha256: digest before release"
            exit 1
          fi

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pipedrive-mcp:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/pipedrive-mcp:latest
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image (keyless OIDC)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/pipedrive-mcp@${DIGEST}
