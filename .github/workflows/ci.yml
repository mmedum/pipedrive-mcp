name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# bash on every runner, for every `run` step in this file. The Windows
# runner defaults to PowerShell, which reads a flag like
# -coverprofile=cov.out as a file called `cov`. The pins gate checks it.
defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Build, vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: Verify gofmt
        run: make fmt

      - name: go vet
        run: go vet ./...

      # Each build tag's files compile only under that tag, so an
      # untagged vet never sees them.
      - name: go vet (integration suite)
        run: go vet -tags=integration ./...

      - name: go vet (evals)
        run: go vet -tags=live ./...

      - name: Build (host target)
        run: go build ./...

      - name: go mod verify
        run: go mod verify

      - name: Test (race, shuffle, coverage)
        run: go test -race -shuffle=on -count=1 -coverprofile=cov.out ./...

      - name: Coverage floor
        run: go run ./scripts/gates coverage cov.out

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - run: make vuln

  licenses:
    name: License compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - run: make licenses

  staleness:
    name: Dependency staleness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - run: go run ./scripts/gates deps

  changelog:
    name: CHANGELOG entry
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Compare against the base branch as it is now
        run: |
          set -euo pipefail
          base=$(./.github/merge-base.sh "${{ github.event.pull_request.base.ref }}" "${{ github.event.pull_request.head.sha }}")
          echo "base: $base"
          go run ./scripts/gates changelog "$base" "${{ github.event.pull_request.head.sha }}"

  # What a pull request changes in the tool surface, measured from the
  # merge-base of its head and the base branch as the full-history
  # checkout sees it now, never github.event.pull_request.base.sha, which
  # is fixed when the event fires. Both sides are built from commits, the
  # merge-base and the head, never this checkout, which is the merge
  # commit. Every commit the pull request adds is read for the footer, so
  # merging main into the branch does not drop it.
  schema-ack:
    name: Schema change acknowledged
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      PR_BASE_REF: origin/${{ github.base_ref }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - run: go run ./scripts/gates schema-ack "$PR_BASE_REF" "$PR_HEAD"

  stdio-smoke:
    name: Stdio smoke (binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          # Its own cache: make build compiles with -trimpath and cgo off,
          # which no other job does, so on go.sum's shared key it builds
          # cold on every run. One pattern a line, as setup-go reads them:
          # https://github.com/actions/setup-go/blob/b7ad1dad31e06c5925ef5d2fc7ad053ef454303e/docs/advanced-usage.md#multi-target-builds
          cache-dependency-path: |
            go.sum
            Makefile
      - run: make build
      - run: go run ./scripts/gates smoke binary ./pipedrive-mcp
      - run: ./pipedrive-mcp --dump-schemas | go run ./scripts/gates descriptions -

  leaks:
    name: Identifier scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - run: go run ./scripts/gates leaks

  docs:
    name: Docs references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - run: go run ./scripts/gates docs

  pins:
    name: Action and tool pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - run: go run ./scripts/gates pins
      - run: go run ./scripts/gates mcpb
      - run: go run ./scripts/gates changelog-links

  # make check and this workflow run the same gates, and parity holds the
  # two lists equal.
  gate-lists:
    name: Gate lists agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - run: go run ./scripts/gates parity

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans HEAD's whole history, so a shallow clone would
          # hide a credential a branch added and later removed.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
          # Its own cache, keyed by the Makefile that pins gitleaks. Every
          # other job shares go.sum's key and saves a cache without
          # gitleaks, and setup-go saves nothing over a hit on its key, so
          # on that key gitleaks is built from source on every run.
          # https://github.com/actions/setup-go/blob/b7ad1dad31e06c5925ef5d2fc7ad053ef454303e/src/cache-save.ts#L75-L80
          cache-dependency-path: Makefile
      # The Makefile holds the scanner's command and its version, so
      # `make check` and the pre-commit hook scan with exactly this.
      - run: make gitleaks
