name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"
  GOVULNCHECK_VERSION: "v1.1.4"
  GO_LICENSES_VERSION: "v1.6.0"
  GOLANGCI_LINT_VERSION: "v2.13.2"

# bash on every runner, for every `run` step in this file. The Windows
# runner defaults to PowerShell, which reads a flag like
# -coverprofile=cov.out as a file called `cov`. The pins gate checks it.
defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Build, vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Verify gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt issues:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build (host target)
        run: go build ./...

      - name: go mod verify
        run: go mod verify

      - name: Test (race, shuffle, coverage)
        run: go test -race -shuffle=on -count=1 -coverprofile=cov.out ./...

      - name: Coverage thresholds
        run: |
          set -euo pipefail
          if [ ! -s cov.out ]; then
            echo "no coverage output (no Go packages yet?) — skipping threshold check"
            exit 0
          fi
          # Compute statement-weighted coverage per package directly from
          # cov.out. Each non-header line is "path:range numStatements count";
          # statement coverage = sum(numStatements where count > 0) /
          # sum(numStatements). Matches what `go test` prints.
          fail=0
          for pkg in internal/pipedrive internal/tools internal/credentials internal/app; do
            total=$(awk -v p="$pkg" 'NR > 1 && index($1, p) { s += $2 } END { print s+0 }' cov.out)
            if [ "$total" = "0" ]; then
              echo "$pkg not present yet — skipped"
              continue
            fi
            covered=$(awk -v p="$pkg" 'NR > 1 && index($1, p) && $3 > 0 { s += $2 } END { print s+0 }' cov.out)
            cov=$(awk -v c="$covered" -v t="$total" 'BEGIN { printf "%.1f", c*100/t }')
            echo "$pkg coverage: ${cov}%"
            awk -v c="$cov" 'BEGIN { exit !(c+0 < 80) }' && { echo "::error::$pkg coverage ${cov}% < 80%"; fail=1; }
          done
          [ "$fail" = "0" ]

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...

  licenses:
    name: License compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - run: |
          go install github.com/google/go-licenses@${{ env.GO_LICENSES_VERSION }}
          go-licenses check ./... \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0

  staleness:
    name: Dependency staleness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - run: go run ./scripts/gates deps

  changelog:
    name: CHANGELOG entry
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Compare against the base branch as it is now
        run: |
          set -euo pipefail
          base=$(./.github/merge-base.sh "${{ github.event.pull_request.base.ref }}" "${{ github.event.pull_request.head.sha }}")
          echo "base: $base"
          go run ./scripts/gates changelog "$base" "${{ github.event.pull_request.head.sha }}"

  schema-diff:
    name: Tool schema diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - name: Build PR binary and dump schemas
        run: |
          go build -o /tmp/pr-bin ./cmd/pipedrive-mcp
          /tmp/pr-bin --dump-schemas > /tmp/pr-schemas.json
      - name: Build base binary and dump schemas
        run: |
          set -euo pipefail
          # Compare against the PR's base branch, not the latest tag —
          # see CHANGELOG entry for why.
          base=$(./.github/merge-base.sh "${{ github.event.pull_request.base.ref }}" "${{ github.event.pull_request.head.sha }}")
          echo "base: $base"
          git worktree add /tmp/base-tree "$base"
          cd /tmp/base-tree
          # base = the target branch (typically main); a base-build
          # failure means main is broken and the gate should fail
          # loudly rather than silently passing schema diffs through.
          go build -o /tmp/base-bin ./cmd/pipedrive-mcp
          /tmp/base-bin --dump-schemas > /tmp/base-schemas.json
      - name: Diff
        run: |
          if [ -f /tmp/base-schemas.json ]; then
            diff -u /tmp/base-schemas.json /tmp/pr-schemas.json || {
              msg=$(git log -1 --format=%B "${{ github.event.pull_request.head.sha }}")
              if echo "$msg" | grep -q "^BREAKING CHANGE:"; then
                echo "Schema change with BREAKING CHANGE: footer — OK (treat as MAJOR)"
                exit 0
              fi
              if echo "$msg" | grep -q "^SCHEMA-CHANGE:"; then
                echo "Schema change with SCHEMA-CHANGE: footer — OK (additive / non-breaking, treat as MINOR)"
                exit 0
              fi
              echo "::error::tool schema changed without an acknowledgement footer."
              echo "::error::Add 'SCHEMA-CHANGE: <description>' for additive/non-breaking changes,"
              echo "::error::or 'BREAKING CHANGE: <description>' for breaking ones, on the head commit."
              exit 1
            }
          fi

  stdio-smoke:
    name: Stdio smoke (binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - run: go build -o /tmp/pipedrive-mcp ./cmd/pipedrive-mcp
      - run: go run ./scripts/gates smoke binary /tmp/pipedrive-mcp

  leaks:
    name: Identifier scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - run: go run ./scripts/gates leaks

  pins:
    name: Action and tool pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - run: go run ./scripts/gates pins
      - run: go run ./scripts/gates mcpb

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A SHA pins the action, not the gitleaks the action installs.
          # Named here so which scanner ran is a line in this file, and
          # kept equal to the rev in .pre-commit-config.yaml — the pins
          # gate fails if they drift, because a commit passing the hook
          # and failing the job teaches the wrong thing about CI. No `v`
          # prefix: the action's README documents the bare form.
          GITLEAKS_VERSION: "8.30.1"
