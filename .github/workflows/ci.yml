name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"
  GOVULNCHECK_VERSION: "v1.8.0"
  GO_LICENSES_VERSION: "v1.6.0"
  GOLANGCI_LINT_VERSION: "v2.14.0"

# bash on every runner, for every `run` step in this file. The Windows
# runner defaults to PowerShell, which reads a flag like
# -coverprofile=cov.out as a file called `cov`. The pins gate checks it.
defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Build, vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Verify gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt issues:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build (host target)
        run: go build ./...

      - name: go mod verify
        run: go mod verify

      - name: Test (race, shuffle, coverage)
        run: go test -race -shuffle=on -count=1 -coverprofile=cov.out ./...

      - name: Coverage thresholds
        run: |
          set -euo pipefail
          if [ ! -s cov.out ]; then
            echo "no coverage output (no Go packages yet?) — skipping threshold check"
            exit 0
          fi
          # Compute statement-weighted coverage per package directly from
          # cov.out. Each non-header line is "path:range numStatements count";
          # statement coverage = sum(numStatements where count > 0) /
          # sum(numStatements). Matches what `go test` prints.
          fail=0
          for pkg in internal/pipedrive internal/tools internal/credentials internal/app; do
            total=$(awk -v p="$pkg" 'NR > 1 && index($1, p) { s += $2 } END { print s+0 }' cov.out)
            if [ "$total" = "0" ]; then
              echo "$pkg not present yet — skipped"
              continue
            fi
            covered=$(awk -v p="$pkg" 'NR > 1 && index($1, p) && $3 > 0 { s += $2 } END { print s+0 }' cov.out)
            cov=$(awk -v c="$covered" -v t="$total" 'BEGIN { printf "%.1f", c*100/t }')
            echo "$pkg coverage: ${cov}%"
            awk -v c="$cov" 'BEGIN { exit !(c+0 < 80) }' && { echo "::error::$pkg coverage ${cov}% < 80%"; fail=1; }
          done
          [ "$fail" = "0" ]

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...

  licenses:
    name: License compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - run: |
          go install github.com/google/go-licenses@${{ env.GO_LICENSES_VERSION }}
          go-licenses check ./... \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0

  staleness:
    name: Dependency staleness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - run: go run ./scripts/gates deps

  changelog:
    name: CHANGELOG entry
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare against the base branch as it is now
        run: |
          set -euo pipefail
          base=$(./.github/merge-base.sh "${{ github.event.pull_request.base.ref }}" "${{ github.event.pull_request.head.sha }}")
          echo "base: $base"
          go run ./scripts/gates changelog "$base" "${{ github.event.pull_request.head.sha }}"

  # What a pull request changes in the tool surface, measured from the
  # merge-base of its head and the base branch as the full-history
  # checkout sees it now, never github.event.pull_request.base.sha, which
  # is fixed when the event fires. Both sides are built from commits, the
  # merge-base and the head, never this checkout, which is the merge
  # commit. Every commit the pull request adds is read for the footer, so
  # merging main into the branch does not drop it.
  schema-ack:
    name: Schema change acknowledged
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      PR_BASE_REF: origin/${{ github.base_ref }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - run: go run ./scripts/gates schema-ack "$PR_BASE_REF" "$PR_HEAD"

  stdio-smoke:
    name: Stdio smoke (binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - run: go build -o /tmp/pipedrive-mcp ./cmd/pipedrive-mcp
      - run: go run ./scripts/gates smoke binary /tmp/pipedrive-mcp

  leaks:
    name: Identifier scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - run: go run ./scripts/gates leaks

  pins:
    name: Action and tool pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true
      - run: go run ./scripts/gates pins
      - run: go run ./scripts/gates mcpb
      - run: go run ./scripts/gates changelog-links

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A SHA pins the action, not the gitleaks the action installs.
          # Named here so which scanner ran is a line in this file, and
          # kept equal to the rev in .pre-commit-config.yaml — the pins
          # gate fails if they drift, because a commit passing the hook
          # and failing the job teaches the wrong thing about CI. No `v`
          # prefix: the action's README documents the bare form.
          GITLEAKS_VERSION: "8.30.1"
