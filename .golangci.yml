version: "2"

run:
  timeout: 5m
  # Lint the integration suite too. Nothing else compiles it — `go
  # build ./...` and `go vet ./...` both skip files behind a tag — so
  # without this the one package that talks to the real API is the one
  # package no gate type-checks.
  build-tags:
    - integration

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - misspell
    - unparam
    - gocritic
    - revive
    - bodyclose
    - errorlint
    - nilerr
    - prealloc
    - makezero
    - rowserrcheck
    - forbidigo
    - depguard

  settings:
    misspell:
      locale: US
    forbidigo:
      # The MCP spec's stdio transport is normative: the server MUST NOT
      # write anything to stdout that is not a valid MCP message, and MAY
      # log to stderr. A stray print corrupts the JSON-RPC stream and the
      # client silently stops working, so the process's streams are named
      # in exactly one place and forbidden everywhere else.
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: stdout carries only MCP JSON-RPC frames; take an io.Writer instead
        - pattern: ^os\.Stdout$
          msg: stdout carries only MCP JSON-RPC frames; take an io.Writer instead
    depguard:
      rules:
        # The HTTP client imports the standard library alone, so it stays
        # usable and testable without the MCP transport and no generated
        # client reaches it (D-70, D-71).
        pipedrive-client-stdlib-only:
          list-mode: strict
          files:
            - "**/internal/pipedrive/**"
          allow:
            - $gostd
          deny:
            - pkg: github.com/modelcontextprotocol/go-sdk
              desc: internal/pipedrive is the HTTP client and imports nothing of MCP; put schemas and presentation in internal/tools (D-70)
        # Pipedrive's OpenAPI description inlines every response shape and
        # declares no 401, 403, 429 or 5xx, so a generated client has no
        # shared types and nothing the error mapping could be built from.
        hand-written-client:
          list-mode: lax
          deny:
            - pkg: github.com/juhokoskela/pipedrive-go
              desc: a client generated from Pipedrive's OpenAPI description; the Pipedrive client is the hand-written internal/pipedrive (D-71)
            - pkg: github.com/oapi-codegen/runtime
              desc: the runtime of oapi-codegen's generated clients; the Pipedrive client is the hand-written internal/pipedrive (D-71)
    gocyclo:
      min-complexity: 15
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: var-naming
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: unused-parameter
        - name: empty-block
        - name: unreachable-code
        - name: redefines-builtin-id
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
        - opinionated
      disabled-checks:
        - whyNoLint
        - hugeParam

  exclusions:
    rules:
      # scripts/ is maintainer tooling run at a terminal, not the server.
      - path: ^scripts/
        linters: [forbidigo]
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
